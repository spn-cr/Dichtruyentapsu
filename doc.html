<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đọc truyện</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="chapter">
    <h1 id="chapter-title">Đang tải...</h1>

    <div id="chapter-content"></div>

    <hr>

    <div class="chapter-nav">
        <a id="prev-link" href="#">⬅ Chương trước</a>

        <a id="toc-link" href="#">📑 Mục lục</a>

        <a id="next-link" href="#">Chương sau ➡</a>
    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const storyId = params.get("id");
const chapterSo = params.get("chuong");

fetch("data/truyen.json")
  .then(response => response.json())
  .then(data => {

    const truyen = data.truyen.find(item => item.id === storyId);

    if (!truyen) {
      document.getElementById("chapter-title").innerText = "Không tìm thấy truyện!";
      return;
    }

    const chuong = truyen.chuong.find(item => item.so == chapterSo);

    if (!chuong) {
      document.getElementById("chapter-title").innerText = "Không tìm thấy chương!";
      return;
    }

    document.getElementById("chapter-title").innerText =
      "Chương " + chuong.so + ": " + chuong.ten;

    // Link về mục lục
    document.getElementById("toc-link").href =
      "truyen.html?id=" + truyen.id;

    // Tìm vị trí chương hiện tại
    const index = truyen.chuong.findIndex(
      item => item.so == chapterSo
    );

    // Nút Chương trước
    if (index > 0) {
      document.getElementById("prev-link").href =
        "doc.html?id=" + truyen.id +
        "&chuong=" + truyen.chuong[index - 1].so;
    } else {
      document.getElementById("prev-link").style.visibility = "hidden";
    }

    // Nút Chương sau
    if (index < truyen.chuong.length - 1) {
      document.getElementById("next-link").href =
        "doc.html?id=" + truyen.id +
        "&chuong=" + truyen.chuong[index + 1].so;
    } else {
      document.getElementById("next-link").style.visibility = "hidden";
    }

    return fetch(chuong.file);
  })
  .then(response => response.text())
  .then(text => {
    document.getElementById("chapter-content").innerText = text;
  })
  .catch(error => {
    console.error(error);
  });
</script>

</body>
</html>
